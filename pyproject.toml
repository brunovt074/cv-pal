[project]
name = "cvpal"
version = "0.1.0"
description = "AI-powered CV/cover-letter knowledge base and generation engine"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.68",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "odfpy>=1.4",
    "gspread>=6.1",
    "google-auth>=2.35",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.13",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
cvpal = "cvpal.interfaces.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
